<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KENDY APK STUDIO</title>
<style>
:root{--bg:#0b0f17;--panel:#121826;--panel2:#18202f;--line:#243049;--text:#e6ebf5;--muted:#8b97b0;--accent:#4f8cff;--accent2:#7c5cff;--ok:#2fd38a;--err:#ff5c70;--warn:#ffb84d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input{font:inherit;color:inherit}
.app{display:flex;height:100%}
aside{width:250px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:4px;flex-shrink:0;overflow-y:auto}
.brand{font-weight:800;letter-spacing:.5px;font-size:17px;padding:4px 10px 14px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:8px 12px;border-radius:10px;color:var(--muted);text-decoration:none;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.nav:hover:not(.off){background:var(--panel2);color:var(--text)}
.nav.active{background:rgba(79,140,255,.15);color:var(--text)}
.nav.off{opacity:.45;cursor:not-allowed}
.tag{font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
main{flex:1;overflow-y:auto;padding:24px;min-width:0}
.top{display:none;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.burger{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:20px}
h1{margin:0 0 4px;font-size:24px}h2{margin:0 0 12px;font-size:17px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));border:0;font-weight:700;color:#fff}
.btn.danger{color:var(--err)}
.btn.big{min-height:60px;font-size:17px;padding:14px 26px}
.drop{border:2px dashed var(--line);border-radius:16px;padding:38px 16px;text-align:center;transition:.2s}
.drop.over{border-color:var(--accent);background:rgba(79,140,255,.08)}
.bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:14px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .15s}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px}
.kv div:nth-child(odd){color:var(--muted)}
.kv div{word-break:break-word}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.icon{width:72px;height:72px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);object-fit:cover}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;min-height:36px}
.chip.on{border-color:var(--accent);background:rgba(79,140,255,.18)}
input[type=search],input[type=text]{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);outline:none}
input:focus{border-color:var(--accent)}
.files{max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:12px}
.file{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.file:hover,.file.sel{background:var(--panel2)}
.file span:first-child{word-break:break-all}.file span:last-child{color:var(--muted);white-space:nowrap}
.note{padding:12px 14px;border-radius:12px;background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.35);color:var(--warn);font-size:14px}
.perm{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:calc(100% - 28px)}
.toast{padding:12px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);animation:in .2s}
.toast.ok{border-color:var(--ok)}.toast.err{border-color:var(--err)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:820px){
 .top{display:flex}.app{flex-direction:column}
 aside{position:fixed;inset:0 25% 0 0;z-index:40;transform:translateX(-100%);transition:.25s;width:auto;max-width:320px}
 aside.open{transform:none}
 main{padding:16px}.kv{grid-template-columns:1fr}.kv div:nth-child(odd){margin-top:6px}
}
</style>
</head>
<body>
<div class="top"><button class="burger" id="burger" aria-label="Menú">☰</button><b>KENDY APK STUDIO</b></div>
<div class="app">
  <aside id="side">
    <div class="brand">KENDY APK STUDIO</div>
    <a class="nav" href="#/home" data-r="home">Inicio</a>
    <a class="nav" href="#/projects" data-r="projects">Mis proyectos</a>
    <a class="nav" href="#/import" data-r="import">Importar APK</a>
    <span class="nav off">Editor de código <span class="tag">módulo 3</span></span>
    <span class="nav off">Imágenes e iconos <span class="tag">módulo 3</span></span>
    <span class="nav off">Propiedades <span class="tag">módulo 3</span></span>
    <span class="nav off">Compilación <span class="tag">módulo 4</span></span>
    <span class="nav off">Firma digital <span class="tag">módulo 4</span></span>
    <span class="nav off">Versiones y enlaces <span class="tag">módulo 5</span></span>
    <a class="nav" href="#/settings" data-r="settings">Configuración</a>
  </aside>
  <main id="view"></main>
</div>
<div id="toasts"></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const MAX_MB = 200;
const apiBase = () => (localStorage.getItem("kendy_api") || "").replace(/\/$/, "");
const fmt = n => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(1) + " MB";
// Todo texto que viene de un APK es no confiable: se inserta SIEMPRE con esc() o textContent.
const esc = s => String(s ?? "—").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(msg, type = "ok") {
  const t = document.createElement("div");
  t.className = "toast " + type; t.textContent = msg;
  $("#toasts").appendChild(t); setTimeout(() => t.remove(), 4500);
}
async function api(path, opts) {
  let res;
  try { res = await fetch(apiBase() + path, opts); }
  catch { throw new Error("No se pudo conectar con el servidor (" + (apiBase() || "mismo origen") + "). Revisa Configuración."); }
  if (!res.ok) {
    let m = "Error " + res.status;
    try { m = (await res.json()).error.message; } catch {}
    throw new Error(m);
  }
  return res.status === 204 ? null : res.json();
}

/* ---------- Vistas ---------- */
const view = $("#view");

function viewHome() {
  view.innerHTML = `<h1>KENDY APK STUDIO</h1>
  <p class="sub">Importa un APK que tengas derecho a modificar, explora su contenido y edita sus recursos.</p>
  <div class="card"><a class="btn primary big" href="#/import">⬆ Importar APK</a>
  <p class="sub" style="margin:14px 0 0">Ahora disponible: carga, análisis y explorador de archivos. Editor, reconstrucción, firma y enlaces de descarga se activarán en los siguientes módulos del backend.</p></div>
  <div class="card"><h2>Estado del servidor</h2><div id="health">Comprobando…</div></div>`;
  api("/health").then(() => { $("#health").textContent = "✔ Conectado"; $("#health").style.color = "var(--ok)"; })
    .catch(e => { $("#health").textContent = "✖ " + e.message; $("#health").style.color = "var(--err)"; });
}

function viewImport() {
  view.innerHTML = `<h1>Importar APK</h1><p class="sub">Máximo ${MAX_MB} MB. El archivo se valida y se analiza en el servidor; nunca se ejecuta.</p>
  <div class="card"><div class="drop" id="drop"><p style="font-size:34px;margin:0">📦</p><p>Arrastra aquí tu APK</p>
  <button class="btn primary big" id="pick">Seleccionar APK</button>
  <input type="file" id="file" accept=".apk,application/vnd.android.package-archive" hidden></div>
  <div id="prog" hidden><div id="progTxt" style="margin-top:14px"></div><div class="bar"><i id="progBar"></i></div></div></div>`;
  const drop = $("#drop"), input = $("#file");
  $("#pick").onclick = () => input.click();
  input.onchange = () => input.files[0] && upload(input.files[0]);
  ["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", ev => ev.dataTransfer.files[0] && upload(ev.dataTransfer.files[0]));
}

function upload(file) {
  if (!/\.apk$/i.test(file.name)) return toast("El archivo debe tener extensión .apk", "err");
  if (file.size > MAX_MB * 1048576) return toast(`El archivo supera ${MAX_MB} MB`, "err");
  const fd = new FormData(); fd.append("file", file);
  const xhr = new XMLHttpRequest();
  $("#prog").hidden = false;
  xhr.upload.onprogress = e => {
    if (!e.lengthComputable) return;
    const p = Math.round(e.loaded / e.total * 100);
    $("#progBar").style.width = p + "%";
    $("#progTxt").textContent = p < 100 ? `Subiendo… ${p}% (${fmt(e.loaded)} / ${fmt(e.total)})` : "Analizando APK en el servidor…";
  };
  xhr.onload = () => {
    let body = {}; try { body = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status === 201) { toast("APK analizado correctamente"); location.hash = "#/project/" + body.id; }
    else { $("#prog").hidden = true; toast(body.error?.message || "Error " + xhr.status, "err"); }
  };
  xhr.onerror = () => { $("#prog").hidden = true; toast("No se pudo conectar con el servidor", "err"); };
  xhr.open("POST", apiBase() + "/api/projects"); xhr.send(fd);
}

async function viewProjects() {
  view.innerHTML = `<h1>Mis proyectos</h1><p class="sub">Cada APK importado es un proyecto independiente.</p><div id="list" class="grid">Cargando…</div>`;
  try {
    const rows = await api("/api/projects");
    const list = $("#list");
    if (!rows.length) { list.innerHTML = `<div class="card">Aún no hay proyectos. <a href="#/import" style="color:var(--accent)">Importa un APK</a>.</div>`; return; }
    list.innerHTML = rows.map(p => `<div class="card" style="margin:0">
      <div class="row"><img class="icon" style="width:52px;height:52px" src="${apiBase()}/api/projects/${esc(p.id)}/icon" alt="" onerror="this.style.visibility='hidden'">
      <div style="min-width:0"><b>${esc(p.name)}</b><div class="perm">${esc(p.package_name)}</div><div class="perm">v${esc(p.version_name)} · ${fmt(Number(p.size_bytes))}</div></div></div>
      <div class="row" style="margin-top:12px"><a class="btn primary" href="#/project/${esc(p.id)}">Abrir</a>
      <button class="btn danger" data-del="${esc(p.id)}">Eliminar</button></div></div>`).join("");
    list.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      if (!confirm("¿Eliminar este proyecto y sus archivos? No se puede deshacer.")) return;
      try { await api("/api/projects/" + b.dataset.del, { method: "DELETE" }); toast("Proyecto eliminado"); viewProjects(); }
      catch (e) { toast(e.message, "err"); }
    });
  } catch (e) { $("#list").innerHTML = `<div class="card" style="color:var(--err)">${esc(e.message)}</div>`; }
}

const CAT = { manifest: "Manifiesto", dex: "Código DEX", image: "Imágenes", "resource-xml": "XML de recursos", resource: "Otros recursos",
  "compiled-resources": "Recursos compilados", assets: "Assets", native: "Bibliotecas nativas", signature: "Firma (META-INF)", other: "Otros" };
const BINARY = new Set(["manifest", "dex", "compiled-resources", "native", "signature", "resource-xml"]);

async function viewProject(id) {
  view.innerHTML = "Cargando…";
  let p, files;
  try { [p, files] = await Promise.all([api("/api/projects/" + id), api("/api/projects/" + id + "/files")]); }
  catch (e) { view.innerHTML = `<div class="card" style="color:var(--err)">${esc(e.message)}</div>`; return; }
  const i = p.info, base = apiBase() + "/api/projects/" + encodeURIComponent(id);
  view.innerHTML = `<h1>${esc(p.name)}</h1><p class="sub">${esc(i.packageName)}</p>
  <div class="card"><div class="row"><img class="icon" src="${base}/icon" alt="" onerror="this.style.visibility='hidden'">
  <div class="kv" style="flex:1;min-width:240px">
   <div>Paquete</div><div>${esc(i.packageName)}</div>
   <div>Versión</div><div>${esc(i.versionName)} (código ${esc(i.versionCode)})</div>
   <div>Android mínimo (SDK)</div><div>${esc(i.minSdk)}</div>
   <div>Android objetivo (SDK)</div><div>${esc(i.targetSdk)}</div>
   <div>Actividad principal</div><div>${esc(i.launchActivity)}</div>
   <div>Tamaño</div><div>${fmt(Number(p.size_bytes))} · ${esc(i.totalFiles)} archivos</div>
   <div>Arquitecturas</div><div>${i.nativeAbis.length ? esc(i.nativeAbis.join(", ")) : "ninguna (sin bibliotecas nativas)"}</div>
   <div>SHA-256 original</div><div class="perm">${esc(p.original_sha256)}</div></div></div>
   <div class="note" style="margin-top:14px" id="iconNote" hidden>El icono no se puede mostrar como imagen (probablemente es un icono adaptativo XML). Se resolverá con Apktool en el módulo 4.</div></div>
  <div class="card"><h2>Permisos declarados (${i.permissions.length})</h2>
   ${i.permissions.length ? i.permissions.map(x => `<div class="perm">${esc(x)}</div>`).join("") : "Ninguno"}</div>
  <div class="card"><h2>Explorador de archivos</h2>
   <input type="search" id="q" placeholder="Buscar por nombre…">
   <div class="chips" id="chips"></div><div class="files" id="files"></div>
   <div id="detail" class="card" style="margin:14px 0 0" hidden></div></div>`;
  const probe = new Image(); probe.onerror = () => { $("#iconNote").hidden = false; }; probe.src = base + "/icon";

  let cat = "all", q = "";
  const render = () => {
    const shown = files.filter(f => (cat === "all" || f.category === cat) && (!q || f.path.toLowerCase().includes(q)));
    $("#files").innerHTML = shown.slice(0, 500).map((f, n) => `<div class="file" data-i="${files.indexOf(f)}"><span>${esc(f.path)}</span><span>${fmt(f.size)}</span></div>`).join("") || `<div class="file">Sin resultados</div>`;
    if (shown.length > 500) $("#files").insertAdjacentHTML("beforeend", `<div class="file"><span>…y ${shown.length - 500} más. Afina la búsqueda.</span></div>`);
  };
  const counts = {}; files.forEach(f => counts[f.category] = (counts[f.category] || 0) + 1);
  $("#chips").innerHTML = `<button class="chip on" data-c="all">Todos (${files.length})</button>` +
    Object.keys(counts).map(c => `<button class="chip" data-c="${esc(c)}">${esc(CAT[c] || c)} (${counts[c]})</button>`).join("");
  $("#chips").onclick = e => { const c = e.target.dataset.c; if (!c) return; cat = c;
    document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === c)); render(); };
  $("#q").oninput = e => { q = e.target.value.toLowerCase(); render(); };
  $("#files").onclick = e => {
    const row = e.target.closest(".file[data-i]"); if (!row) return;
    document.querySelectorAll(".file.sel").forEach(x => x.classList.remove("sel")); row.classList.add("sel");
    const f = files[row.dataset.i], d = $("#detail"); d.hidden = false;
    d.innerHTML = `<div class="kv"><div>Ruta</div><div class="perm">${esc(f.path)}</div><div>Tamaño</div><div>${fmt(f.size)}</div><div>Categoría</div><div>${esc(CAT[f.category] || f.category)}</div></div>
    <p class="note" style="margin-bottom:0">${BINARY.has(f.category)
      ? "Archivo compilado o binario: no es código fuente legible. Para verlo o editarlo se necesita una herramienta de análisis (Apktool/JADX), que llegará con el módulo 4."
      : "La vista previa y la edición de este archivo estarán disponibles en el módulo 3."}</p>`;
  };
  render();
}

function viewSettings() {
  view.innerHTML = `<h1>Configuración</h1><p class="sub">Si el backend está en otro dominio, indica su URL (debe permitir CORS). Déjalo vacío si esta página la sirve el propio backend.</p>
  <div class="card"><label for="api">URL del servidor</label><input type="text" id="api" placeholder="https://api.tudominio.com" value="${esc(apiBase()).replace("—", "")}">
  <div class="row" style="margin-top:12px"><button class="btn primary" id="save">Guardar</button></div></div>`;
  $("#save").onclick = () => { const v = $("#api").value.trim();
    if (v && !/^https?:\/\//.test(v)) return toast("La URL debe empezar por http:// o https://", "err");
    localStorage.setItem("kendy_api", v); toast("Guardado"); };
}

/* ---------- Router ---------- */
function route() {
  const [, r, arg] = (location.hash || "#/home").split("/");
  $("#side").classList.remove("open");
  document.querySelectorAll(".nav[data-r]").forEach(a => a.classList.toggle("active", a.dataset.r === (r === "project" ? "projects" : r)));
  ({ home: viewHome, import: viewImport, projects: viewProjects, settings: viewSettings }[r] || (r === "project" ? () => viewProject(arg) : viewHome))();
}
$("#burger").onclick = () => $("#side").classList.toggle("open");
addEventListener("hashchange", route); route();
</script>
</body>
</html>
